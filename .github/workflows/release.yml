name: Build release
permissions:
  contents: write
  pull-requests: write
# Never let two runs for the same tag publish assets side by side.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
on:
  workflow_dispatch:
    inputs:
      crate:
        description: "Crate name (e.g. edgee-cli)"
        required: true
        type: string
      version:
        description: "Version without leading v (e.g. 0.2.1)"
        required: true
        type: string
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"
jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      crate: ${{ steps.parse.outputs.crate }}
      version: ${{ steps.parse.outputs.version }}
      is_cli: ${{ steps.parse.outputs.is_cli }}
      tag: ${{ steps.parse.outputs.tag }}
    steps:
      - name: Parse crate and version from trigger
        id: parse
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            CRATE="${{ inputs.crate }}"
            VERSION="${{ inputs.version }}"
          else
            TAG="${GITHUB_REF_NAME}"
            if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
              # `v<X.Y.Z>` is reserved for CLI releases.
              VERSION="${TAG#v}"
              CRATE="edgee-cli"
            else
              VERSION=$(echo "$TAG" | grep -oP '\d+\.\d+\.\d+[^-]*$')
              CRATE="${TAG%-${VERSION}}"
            fi
          fi

          if [ -z "$CRATE" ] || [ -z "$VERSION" ]; then
            echo "ERROR: could not parse crate or version from '${GITHUB_REF_NAME}'"
            exit 1
          fi

          # Normalize shorthand tag names: cli → edgee-cli
          [[ "$CRATE" != edgee-* ]] && CRATE="edgee-${CRATE}"

          IS_CLI="false"
          [ "$CRATE" = "edgee-cli" ] && IS_CLI="true"

          if [ "$IS_CLI" != "true" ]; then
            echo "ERROR: only edgee-cli releases are supported (got '$CRATE')"
            exit 1
          fi

          # Derive the tag from the version rather than reading GITHUB_REF_NAME
          # downstream, so workflow_dispatch runs target the same release as a
          # tag push would.
          TAG="v${VERSION}"

          echo "crate=${CRATE}"     >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "is_cli=${IS_CLI}"   >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}"         >> "$GITHUB_OUTPUT"

          echo "Parsed: crate=${CRATE} version=${VERSION} is_cli=${IS_CLI} tag=${TAG}"

  bump-version:
    needs: setup
    runs-on: ubuntu-latest
    env:
      CRATE: ${{ needs.setup.outputs.crate }}
      VERSION: ${{ needs.setup.outputs.version }}
      TAG: ${{ needs.setup.outputs.tag }}
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Resolve manifest path
        id: manifest
        run: |
          MANIFEST=$(cargo metadata --format-version 1 --no-deps \
            | jq -r --arg name "$CRATE" \
              '.packages[] | select(.name == $name) | .manifest_path')
          if [ -z "$MANIFEST" ]; then
            echo "ERROR: no package named '$CRATE' found in workspace"
            exit 1
          fi
          echo "path=${MANIFEST}" >> "$GITHUB_OUTPUT"

      - name: Bump version in Cargo.toml and Cargo.lock
        run: |
          MANIFEST="${{ steps.manifest.outputs.path }}"
          sed -i "s/^version = \"[^\"]*\"/version = \"${VERSION}\"/" "$MANIFEST"
          grep -q "^version = \"${VERSION}\"" "$MANIFEST" || \
            { echo "ERROR: version patch did not apply to $MANIFEST"; exit 1; }
          cargo update -p "$CRATE"

      - name: Open PR with version bump
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="chore/bump-${CRATE}-to-${VERSION}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add "${{ steps.manifest.outputs.path }}" Cargo.lock
          git diff --staged --quiet && echo "Version already up to date, skipping PR." && exit 0
          git commit -m "chore: bump ${CRATE} to ${VERSION}"
          # Force-push so re-running the workflow doesn't trip over the branch
          # left behind by an earlier attempt.
          git push --force origin "$BRANCH"
          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            echo "PR already open for ${BRANCH}, nothing to do."
            exit 0
          fi
          gh pr create \
            --title "chore: bump ${CRATE} to ${VERSION}" \
            --body "Automated version bump triggered by release tag \`${TAG}\`." \
            --base main \
            --head "$BRANCH"

  # Create the draft release exactly once. Letting each matrix job create it on
  # demand races: `GET /releases/tags/<tag>` never returns drafts, so two jobs
  # can both decide the release is missing and each create their own, splitting
  # the assets across duplicate drafts.
  create-release:
    needs: setup
    runs-on: ubuntu-latest
    if: needs.setup.outputs.is_cli == 'true'
    steps:
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.setup.outputs.tag }}
          REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists, reusing it."
            exit 0
          fi
          gh release create "$TAG" \
            --repo "$REPO" \
            --title "$TAG" \
            --target "${{ github.sha }}" \
            --draft \
            --generate-notes

  build-release-binaries:
    needs: [setup, create-release]
    if: needs.setup.outputs.is_cli == 'true'
    strategy:
      matrix:
        platform:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-musl
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            rustflags: -C target-feature=+crt-static
            bin_suffix: .exe
    name: Build release binary (${{ matrix.platform.target }} on ${{ matrix.platform.os }})
    runs-on: ${{ matrix.platform.os }}
    env:
      RUSTFLAGS: ${{ matrix.platform.rustflags || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set version from tag
        shell: bash
        run: |
          VERSION="${{ needs.setup.outputs.version }}"
          sed -i.bak "s/^version = \"[^\"]*\"/version = \"${VERSION}\"/" Cargo.toml
          rm -f Cargo.toml.bak
          grep -q "^version = \"${VERSION}\"" Cargo.toml || \
            { echo "ERROR: version patch did not apply to Cargo.toml"; exit 1; }

      - name: Build binary
        uses: houseabsolute/actions-rust-cross@v1
        with:
          command: build
          target: ${{ matrix.platform.target }}
          args: "-p edgee-cli --bin edgee --release"

      - name: Save binary
        uses: actions/upload-artifact@v4
        with:
          name: edgee.${{ matrix.platform.target }}${{ matrix.platform.bin_suffix || '' }}
          path: target/${{ matrix.platform.target }}/release/edgee${{ matrix.platform.bin_suffix || '' }}
          retention-days: 3

      - name: Prepare release files
        shell: bash
        run: |
          BIN="edgee.${{ matrix.platform.target }}${{ matrix.platform.bin_suffix || '' }}"
          cp "target/${{ matrix.platform.target }}/release/edgee${{ matrix.platform.bin_suffix || '' }}" "$BIN"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$BIN" | awk '{print $1}' > "$BIN.sha256"
          else
            shasum -a 256 "$BIN" | awk '{print $1}' > "$BIN.sha256"
          fi

      - name: Upload release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.setup.outputs.tag }}
          REPO: ${{ github.repository }}
          BIN: edgee.${{ matrix.platform.target }}${{ matrix.platform.bin_suffix || '' }}
        run: |
          # --clobber keeps re-runs idempotent instead of silently skipping the
          # upload when a stale asset from a previous attempt is still there.
          gh release upload "$TAG" "$BIN" "$BIN.sha256" --repo "$REPO" --clobber
