[package]
name = "edgee-cli"
version = "0.3.8"
edition = "2021"
license = "Apache-2.0"
homepage = "https://www.edgee.cloud"
repository = "https://github.com/edgee-ai/edgee"

[[bin]]
name = "edgee"
path = "src/main.rs"

[dependencies]
# External dependencies
anyhow = "1.0.102"
argon2 = "0.5.3"
base64 = "0.22"
clap = { version = "4.6.1", features = ["derive", "env"] }
colored = "3.1.1"
console = "0.16.3"
dialoguer = "0.12.0"
etcetera = "0.11.0"
http = "1.4.0"
open = "5.3.4"
rand = "0.10"
serde = { version = "1.0.228", features = ["derive"] }
toml = "1.1.2"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1.23.1", features = ["v4"] }
tokio = { version = "1.52.1", features = ["rt-multi-thread", "macros", "net", "signal", "io-util", "process", "time", "fs"] }
reqwest = { version = "0.13.2", default-features = false, features = ["json"] }
serde_json = "1.0.149"
self_update = { version = "0.44.0", default-features = false, optional = true, features = ["reqwest", "rustls"] }
time = { version = "0.3.47", features = ["formatting", "parsing", "serde", "serde-human-readable", "macros"] }
unicode-width = "0.2"
x25519-dalek = { version = "3.0.0", features = ["static_secrets", "getrandom"] }

# Local MITM relay (`edgee relay` / app launch targets)
bytes = "1.11.1"
http-body-util = "0.1.3"
hudsucker = "0.24"
rcgen = "0.14"
sha1 = "0.10"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
which = "8"

[features]
default = ["self-update"]
self-update = ["dep:self_update"]
